[project]
name = "jsaux-matrixlink-opensource"
version = "1.2.0"
description = "JSAUX PIXEL / MatrixLink opensource extensions and connection protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  release
  | tmp
  | \.git
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501", "W503"]
exclude = [
  ".git",
  "build",
  "dist",
  "release",
  "tmp",
  "**/__pycache__",
  "decky-plugin/dist",
]

[tool.isort]
profile = "black"
line_length = 100
